apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vote
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: le-resolver
spec:
  ingressClassName: traefik
  rules:
    - host: vote.santu.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vote
                port:
                  number: 8080
  tls:
    - hosts:
        - vote.santu.io

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker
  name: worker
spec:
  replicas: 5
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      initContainers:
        - name: wait-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do echo waiting redis; sleep 2; done"]
        - name: wait-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z db 5432; do echo waiting db; sleep 2; done"]
      containers:
        - image: aboubacar99/pulse-worker:latest
          imagePullPolicy: Always
          name: worker
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: DATABASE_URL
              value: postgres://pulse:pulse@db:5432/pulse
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - image: santu/pulse-api:latest
          imagePullPolicy: Never
          name: api
          env:
            - name: PORT
              value: "3000"
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: DATABASE_URL
              value: postgres://pulse:pulse@db:5432/pulse
          ports:
            - containerPort: 3000
              name: api
